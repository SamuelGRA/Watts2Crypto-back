name: Refresh Criptomonedas Data

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-criptomonedas:
    name: Refresh criptomonedas data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BACKEND_URL: ${{ secrets.BACKEND_URL }}
      REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
      ENDPOINT: criptomonedas

    steps:
      - uses: actions/checkout@v5

      - name: Run refresh
        shell: bash
        run: bash .github/scripts/refresh-endpoint.sh