name: Refresh CPUs Data

on:
  schedule:
    - cron: '0 2 1,17 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-cpus:
    name: Refresh CPUs data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BACKEND_URL: ${{ secrets.BACKEND_URL }}
      REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
      ENDPOINT: cpus

    steps:
      - uses: actions/checkout@v5

      - name: Run refresh
        shell: bash
        run: bash .github/scripts/refresh-endpoint.sh